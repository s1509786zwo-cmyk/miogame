<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いろ</title>
<style>
  :root { }
  html, body { margin:0; padding:0; height:100%; background:#0a0a0c; overflow:hidden; }
  body {
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:#ddd; user-select:none; -webkit-user-select:none; overscroll-behavior:none;
  }
  /* フォント差し替え用スロット(後段で @font-face を追加して上書きする) */
  /* 画面はウィンドウいっぱいに拡大する。操作はキーボードのみ
     (画面下のボタン・十字キーは廃止。ボタン類は canvas 内に描画する) */
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #screen {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background:#000;
    box-shadow: 0 0 0 1px #1c1c20, 0 0 90px rgba(0,0,0,.9);
    display:block;
  }
  /* 部屋の照明に溶け込む、画面外のほんのりした残り火 */
  #stage::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(circle at 50% 50%, rgba(255,45,149,.05), rgba(0,0,0,0) 60%);
  }
  @media (prefers-reduced-motion: reduce) { #stage::after { display:none } }
</style>
</head>
<body>
  <div id="stage"><canvas id="screen" width="320" height="240"></canvas></div>

  <script src="story.js"></script>
  <script src="maps.js"></script>
  <script src="game.js"></script>
  <script src="battle.js"></script>
</body>
</html>
